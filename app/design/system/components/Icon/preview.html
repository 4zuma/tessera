<!-- @dsCard group="Brand" height=248 width=640 subtitle="All 28 line icons: 24-unit grid, 1.5 stroke, currentColor" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body style="margin:0">
<div id="root" style="width:640px;height:248px"></div>
<script>
  var T = window.Tessera, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(7, minmax(0, 1fr))', gap: 8, padding: 16 } }, T.icons.map(function (n) { return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 } }, h(T.Icon, { name: n, size: 24 }), h('span', { className: 'type-caption', style: { color: 'var(--text-2)' } }, n)); })));
</script>
</body>
</html>
