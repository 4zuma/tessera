name: release

# Builds the Windows binaries (x64 and Arm64) and publishes a GitHub release.
#
# Normally it runs by itself: when a push to main changes the version in
# app/src-tauri/tauri.conf.json (set it everywhere with
# `node scripts/bump-version.mjs <version>`), it tags that commit v<version>
# and publishes the release. It does nothing when the version did not change
# or the tag v<version> already exists.
#
# When the release of the current version lacks an architecture (say one was
# just added below), the next run on main builds it from that release's tag and
# adds the files to the release, without a new version.
#
# It can still be started by hand from the Actions tab ("Run workflow",
# version e.g. 0.1.0) or by pushing a tag v0.1.0. The version must match
# tauri.conf.json; for a version that is already released, it only adds
# missing files. The decisions are made by .github/scripts/release-plan.sh.
# The release notes come from the description of the pull request that merged
# the release's commit (normally the version bump), between the lines
# <!-- release-notes --> and <!-- /release-notes -->; without them GitHub
# writes notes from the merged pull requests. See release-publish.sh.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
  push:
    branches: [main]
    # Tags pushed by this workflow use GITHUB_TOKEN, which starts no new run.
    tags: ["v*"]
    # Only checked for pushes to main (GitHub ignores paths for tag pushes).
    paths:
      - app/src-tauri/tauri.conf.json
      - .github/workflows/release.yml
      - .github/scripts/release-*.sh

permissions:
  contents: write
  # the publish step reads the release notes from the bump pull request
  pull-requests: read

jobs:
  plan:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      arches: ${{ steps.plan.outputs.arches }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare the version with the last push and the existing releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/release-plan.sh

  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      ARCH: ${{ matrix.arch }}
      # Arm64 is cross-compiled on the x64 runner (Visual Studio's ARM64 tools)
      TARGET: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # this commit for a new release, the release's tag when adding files
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Build the app (tauri build, no installer)
        working-directory: app
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tauri build --target $env:TARGET
      - name: Build the command-line tool
        run: cargo build --release -p tessera-cli --target $env:TARGET

      - name: Package
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # asset names are all lowercase
          Copy-Item "target/$env:TARGET/release/tessera-app.exe" "out/tessera-$env:TAG-windows-$env:ARCH.exe"
          Copy-Item "target/$env:TARGET/release/tessera.exe" "out/tessera-cli-$env:TAG-windows-$env:ARCH.exe"
          Get-ChildItem out
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: out/*.exe
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    # One publish at a time; the script checks the release again, so a run
    # that waited here never publishes the same files twice.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # the workflow's own commit, for the scripts
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.plan.outputs.mode }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash .github/scripts/release-publish.sh
