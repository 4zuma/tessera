name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (build, test, smoke scan)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # tessera-app embeds the built UI (app/dist), so it is checked by
      # .github/workflows/app.yml after the frontend build.
      - name: Clippy
        run: cargo clippy --workspace --exclude tessera-app --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude tessera-app
      - name: Admin tests (MFT, USN journal)
        # GitHub's Windows runners are elevated, so the ignored MFT and USN
        # tests can run here. Benchmarks stay ignored.
        env:
          TESSERA_ADMIN_TESTS: "1"
        run: cargo test -p tessera-core --test mft --test watch -- --include-ignored
      - name: Build release
        run: cargo build --release -p tessera-cli
      - name: Smoke scan (walk)
        run: target\release\tessera.exe scan C:\ --mode walk --top 5
      - name: Smoke scan (MFT)
        run: target\release\tessera.exe scan C:\ --mode mft --top 5
      - uses: actions/upload-artifact@v7
        with:
          name: tessera-windows-x64
          path: target/release/tessera.exe

  windows-arm64:
    # Windows on Arm, cross-compiled on the x64 runner with Visual Studio's
    # ARM64 tools. The exe can't run on this runner, so this checks that the
    # core and the CLI build and pass clippy for Arm64; the tests run on x64.
    name: Windows arm64 (cross build)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64
      - name: Clippy
        run: cargo clippy --workspace --exclude tessera-app --all-targets --target aarch64-pc-windows-msvc -- -D warnings
      - name: Build release
        run: cargo build --release -p tessera-cli --target aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v7
        with:
          name: tessera-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/tessera.exe
          if-no-files-found: error

  ntfs-images:
    # The only Linux job: it builds real NTFS images with ntfs-3g (hard links,
    # compression, sparse files, a fragmented MFT...) and checks the MFT
    # parser against a mounted walk of each. Everything else runs on Windows.
    name: MFT parser on NTFS images (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install NTFS tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ntfs-3g
      - name: MFT image tests (must not skip)
        # They build volumes with mkntfs and fill them through an ntfs-3g
        # mount (via sudo -n); this run fails instead of skipping.
        env:
          TESSERA_REQUIRE_NTFS_IMAGES: "1"
        run: cargo test -p tessera-core --lib image_tests -- --nocapture
