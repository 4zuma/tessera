name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_walk:
        description: "Smoke scan: walk all of C: (takes 7 to 35 minutes)"
        type: boolean
        default: false

# A new push to a pull request cancels the run of the previous one.
# Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash .github/scripts/ci-changes.sh

  # The jobs below are skipped when the change cannot affect them (only docs,
  # only the app...; see .github/scripts/ci-changes.sh). A skipped job still
  # reports its check as passed, so the required checks of main keep working.
  # They run when the "What changed" job fails.

  windows:
    name: Windows (build, test, smoke scan)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.core != 'false' }}
    runs-on: windows-latest
    # longer for a walk of all of C: (Run workflow with full_walk)
    timeout-minutes: ${{ inputs.full_walk && 60 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # pull requests use main's cache but do not save their own
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      # tessera-app embeds the built UI (app/dist), so it is checked by
      # .github/workflows/app.yml after the frontend build.
      - name: Clippy
        run: cargo clippy --workspace --exclude tessera-app --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude tessera-app
      - name: Admin tests (MFT, USN journal)
        # GitHub's Windows runners are elevated, so the ignored MFT and USN
        # tests can run here. Benchmarks stay ignored.
        env:
          TESSERA_ADMIN_TESTS: "1"
        run: cargo test -p tessera-core --test mft --test watch -- --include-ignored
      - name: Build release
        run: cargo build --release -p tessera-cli
      - name: Smoke scan (walk)
        # A walk of all of C: (1.4M entries) takes 7 to 35 minutes on this
        # runner's slow disk, so it walks the user profiles and ProgramData:
        # junction loops, symbolic links, folders that deny listing and files
        # in use. Run workflow with "full_walk" walks all of C:.
        timeout-minutes: ${{ inputs.full_walk && 50 || 15 }}
        env:
          FULL_WALK: ${{ inputs.full_walk }}
        run: |
          $paths = if ($env:FULL_WALK -eq 'true') { @('C:\') } else { @('C:\Users', 'C:\ProgramData') }
          foreach ($path in $paths) {
            target\release\tessera.exe scan $path --mode walk --top 5
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Smoke scan (MFT)
        run: target\release\tessera.exe scan C:\ --mode mft --top 5
      - uses: actions/upload-artifact@v7
        with:
          name: tessera-windows-x64
          path: target/release/tessera.exe

  windows-arm64:
    # Windows on Arm, natively: GitHub's free Arm64 runners for public
    # repositories. Same tests and smoke scans as the x64 job, so the arm64
    # release (cross-compiled from the same code) is not shipped untested.
    name: Windows arm64 (build, test, smoke scan)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.core != 'false' }}
    runs-on: windows-11-arm
    timeout-minutes: ${{ inputs.full_walk && 60 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --exclude tessera-app --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude tessera-app
      - name: Admin tests (MFT, USN journal)
        env:
          TESSERA_ADMIN_TESTS: "1"
        run: cargo test -p tessera-core --test mft --test watch -- --include-ignored
      - name: Build release
        run: cargo build --release -p tessera-cli
      - name: Smoke scan (walk)
        # the same folders as the x64 job (see there)
        timeout-minutes: ${{ inputs.full_walk && 50 || 15 }}
        env:
          FULL_WALK: ${{ inputs.full_walk }}
        run: |
          $paths = if ($env:FULL_WALK -eq 'true') { @('C:\') } else { @('C:\Users', 'C:\ProgramData') }
          foreach ($path in $paths) {
            target\release\tessera.exe scan $path --mode walk --top 5
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Smoke scan (MFT)
        run: target\release\tessera.exe scan C:\ --mode mft --top 5
      - uses: actions/upload-artifact@v7
        with:
          name: tessera-windows-arm64
          path: target/release/tessera.exe
          if-no-files-found: error

  ntfs-images:
    # The only Linux job: it builds real NTFS images with ntfs-3g (hard links,
    # compression, sparse files, a fragmented MFT...) and checks the MFT
    # parser against a mounted walk of each. Everything else runs on Windows.
    name: MFT parser on NTFS images (Linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.core != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install NTFS tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ntfs-3g
      - name: MFT image tests (must not skip)
        # They build volumes with mkntfs and fill them through an ntfs-3g
        # mount (via sudo -n); this run fails instead of skipping.
        env:
          TESSERA_REQUIRE_NTFS_IMAGES: "1"
        run: cargo test -p tessera-core --lib image_tests -- --nocapture
