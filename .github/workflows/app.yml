name: app

on:
  push:
    branches: [main]
    paths: ["app/**", "crates/tessera-core/**", "Cargo.toml", "Cargo.lock", "docs/ipc.md", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "crates/tessera-core/**", "Cargo.toml", "Cargo.lock", "docs/ipc.md", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI (type check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  windows:
    name: Windows exe
    needs: ui
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - run: npm ci
      # the app crate embeds app/dist, so build the UI first
      - run: npm run build
      - name: Clippy
        run: cargo clippy -p tessera-app --all-targets -- -D warnings
      - name: Test
        run: cargo test -p tessera-app
      - name: Build (tauri build, no installer)
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-app-windows-x64
          # the crate is a member of the root workspace, so it builds into ./target
          path: target/release/tessera-app.exe
          if-no-files-found: error
